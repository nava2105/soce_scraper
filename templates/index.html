<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Data Extraction</title>
    <style>
        #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Extractor de datos</h1>
        <form id="dataForm" action="{{ url_for('extract') }}" method="POST">
            <div class="form-group">
                <label for="start_date">Fecha de inicio:</label>
                <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end_date">Fecha de finalización:</label>
                <input type="date" class="form-control" id="end_date" name="end_date" required>
            </div>
            <div class="form-group">
                <label for="type">Tipo de proceso:</label>
                <select class="form-control" id="type" name="type" required>
                    <option value="1">Ínfima Cuantía</option>
                    <option value="2">Procesos</option>
                    <option value="3">Regimen Especial</option>
                    <option value="4">Procedimiento especial</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Extract Data</button>
        </form>
        <div id="loading" class="mt-3">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <span> Processing your request...</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#dataForm').on('submit', function(e) {
            e.preventDefault(); // Prevent the default form submission
            document.getElementById('loading').style.display = 'block';

            $.ajax({
                type: 'POST',
                url: $(this).attr('action'),
                data: $(this).serialize(),
                xhrFields: {
                    responseType: 'blob' // Set the response type to blob for file download
                },
                success: function(data, status, xhr) {
                    // Create a link element to download the file
                    var blob = new Blob([data], { type: xhr.getResponseHeader('Content-Type') });
                    var link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = xhr.getResponseHeader('Content-Disposition').split('filename=')[1]; // Get filename from header
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    document.getElementById('loading').style.display = 'none'; // Hide loading indicator
                },
                error: function() {
                    alert('An error occurred while processing your request.');
                    document.getElementById('loading').style.display = 'none'; // Hide loading indicator
                }
            });
        });
    </script>
</body>
</html>
